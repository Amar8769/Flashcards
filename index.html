<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'DM Sans', sans-serif;
      padding: 2rem;
    }

    h1 {
      color: #e8e8e8;
      margin-bottom: 0.5rem;
      font-weight: 700;
      font-size: 1.75rem;
    }

    .counter {
      color: #a0aec0;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .flashcard-container {
      perspective: 1200px;
      width: 100%;
      max-width: 420px;
      min-height: 280px;
    }

    .flashcard {
      position: relative;
      width: 100%;
      min-height: 280px;
      transform-style: preserve-3d;
      cursor: pointer;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .flashcard.flipped {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      min-height: 280px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 20px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .flashcard-front {
      background: linear-gradient(160deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .flashcard-back {
      background: linear-gradient(160deg, #11998e 0%, #38ef7d 100%);
      color: white;
      transform: rotateY(180deg);
    }

    .face-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      opacity: 0.85;
      margin-bottom: 1rem;
    }

    .content {
      font-size: 1.25rem;
      line-height: 1.6;
      font-weight: 500;
    }

    .flashcard-back .content {
      font-size: 1.1rem;
    }

    .hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .controls {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-next {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .btn-shuffle {
      background: rgba(255, 255, 255, 0.2);
      color: #e8e8e8;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <h1>Flashcards</h1>
  <p class="counter">Card <span id="current">1</span> of 10</p>

  <div class="flashcard-container">
    <div class="flashcard" id="card">
      <div class="flashcard-face flashcard-front">
        <span class="face-label">Question</span>
        <p class="content" id="question"></p>
        <span class="hint">Click to flip</span>
      </div>
      <div class="flashcard-face flashcard-back">
        <span class="face-label">Answer</span>
        <p class="content" id="answer"></p>
        <span class="hint">Click to flip back</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-next" id="nextBtn">Next card</button>
    <button class="btn-shuffle" id="shuffleBtn">Shuffle</button>
  </div>

  <script>
    const questions = [
      { q: "What is the capital of France?", a: "Paris" },
      { q: "How many continents are there?", a: "Seven" },
      { q: "What is the largest planet in our solar system?", a: "Jupiter" },
      { q: "Who wrote Romeo and Juliet?", a: "William Shakespeare" },
      { q: "What is the chemical symbol for water?", a: "H₂O" },
      { q: "In what year did World War II end?", a: "1945" },
      { q: "What is the speed of light (approximately)?", a: "299,792 km/s" },
      { q: "Which organ pumps blood through the body?", a: "The heart" },
      { q: "What is the smallest prime number?", a: "2" },
      { q: "What does CPU stand for?", a: "Central Processing Unit" }
    ];

    let deck = [];
    let currentIndex = 0;
    const cardEl = document.getElementById('card');
    const questionEl = document.getElementById('question');
    const answerEl = document.getElementById('answer');
    const currentSpan = document.getElementById('current');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function initDeck() {
      deck = shuffleArray(questions);
      currentIndex = 0;
      showCard();
      cardEl.classList.remove('flipped');
    }

    function showCard() {
      const item = deck[currentIndex];
      questionEl.textContent = item.q;
      answerEl.textContent = item.a;
      currentSpan.textContent = currentIndex + 1;
    }

    function flipCard() {
      cardEl.classList.toggle('flipped');
    }

    function nextCard() {
      cardEl.classList.remove('flipped');
      currentIndex = (currentIndex + 1) % deck.length;
      showCard();
    }

    cardEl.addEventListener('click', flipCard);
    nextBtn.addEventListener('click', nextCard);
    shuffleBtn.addEventListener('click', initDeck);

    initDeck();
  </script>
</body>
</html>
